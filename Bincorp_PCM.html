function seed(){const y=new Date().getFullYear(), date=new Date().toISOString();return {profileRevision:'bincorp-1',company:{name:'Bincorp',group:'Bincorp',specialty:'Inspeção por ultrassom',members:'Davi Melo\nPedro Henrique'},equipment:[['BOM-101','Bomba centrífuga','Bomba','Área de utilidades'],['CMP-201','Compressor de ar','Compressor','Sala de compressores'],['MOT-301','Motor da esteira','Motor elétrico','Linha de produção 01'],['QDF-401','Quadro de distribuição','Painel elétrico','Sala elétrica'],['EST-501','Esteira transportadora','Transportador','Expedição'],['VEN-601','Ventilador industrial','Ventilador','Área de utilidades']].map((e,i)=>({id:'eq-'+i,tag:e[0],name:e[1],category:e[2],location:e[3],manufacturer:'Fabricante didático',model:'Modelo de demonstração',description:'Ativo fictício para exercícios de manutenção industrial. Sem especificações de fabricante real.',active:i!==4})),requests:[['eq-1','Ruído atípico durante a operação do compressor.','Corretiva','Alta','Aberta','Ana Silva'],['eq-0','Verificar tendência de vibração da bomba.','Preditiva','Média','Em análise','Lucas Santos'],['eq-2','Programar inspeção preventiva do motor.','Preventiva','Média','Aberta','Mariana Costa'],['eq-3','Melhorar a identificação dos circuitos do quadro.','Melhoria','Baixa','Aberta','Pedro Oliveira']].map((r,i)=>({id:'ss-'+i,number:`SS-${y}-${String(i+1).padStart(3,'0')}`,date,equipmentId:r[0],description:r[1],type:r[2],priority:r[3],status:r[4],requester:r[5]})),counters:{[y]:4}}}
function validateEquipment(d,state,id){if(!d.tag?.trim()||!d.name?.trim()||!d.category?.trim()||!d.location?.trim())throw Error('Preencha TAG, nome, categoria e localização.');if(state.equipment.some(e=>e.id!==id&&e.tag.toLowerCase()===d.tag.trim().toLowerCase()))throw Error('Esta TAG já está cadastrada. Use uma TAG única.');}
function validateRequest(d,state){if(!d.requester?.trim()||!d.description?.trim()||!d.equipmentId)throw Error('Preencha todos os campos obrigatórios.');if(!state.equipment.some(e=>e.id===d.equipmentId))throw Error('Selecione um equipamento cadastrado.');if(!types.includes(d.type)||!priorities.includes(d.priority)||!statuses.includes(d.status))throw Error('Selecione opções válidas.');}
function nextNumber(state){let y=new Date().getFullYear();state.counters??={};const max=Math.max(state.counters[y]||0,...state.requests.filter(r=>r.number.startsWith(`SS-${y}-`)).map(r=>Number(r.number.split('-').pop())||0));state.counters[y]=max+1;return `SS-${y}-${String(max+1).padStart(3,'0')}`;}

let page=location.hash.slice(1)||'painel',query='',filter='Todos',typeFilter='Todos',pageIndex=0,collapsed=false,mobile=false;const titles={painel:'Painel inicial',empresa:'Configuração da empresa',equipamentos:'Equipamentos',solicitacoes:'Solicitações de serviço',fluxo:'Fluxo de manutenção',os:'Ordens de serviço'};if(!titles[page])page='painel';

function commit(mutator){const next=structuredClone(state);mutator(next);try{localStorage.setItem(KEY,JSON.stringify(next));}catch{throw Error('Não foi possível salvar. Verifique o espaço e as permissões de armazenamento do navegador.');}state=next;storageError=false;}
function nav(id,i,label){return `<a href="#${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''} title="${label}">${icon(i)}<span class="label">${label}</span></a>`;}
function shell(){document.getElementById('app').innerHTML=`<div class="shell ${collapsed?'collapsed':''} ${mobile?'mobile-open':''}"><aside class="sidebar"><button class="mobile-close iconbtn" data-action="menu" aria-label="Fechar menu">${icon('close')}</button><a href="#painel" class="brand"><span class="brandmark">${icon('activity')}</span><span class="brandtext">PCM<span style="font-weight:450"> didático</span><small>MANUTENÇÃO INDUSTRIAL</small></span></a><a href="#empresa" class="company"><span class="tile">${icon('building')}</span><span><b>${esc(state.company.name)}</b><small>${esc(state.company.specialty)}</small></span></a><div class="navtitle">ÁREA DE TRABALHO</div><nav>${nav('painel','grid','Painel inicial')}${nav('equipamentos','box','Equipamentos')}${nav('solicitacoes','file','Solicitações de serviço')}${nav('fluxo','flow','Fluxo de manutenção')}<button disabled title="Disponível em uma próxima etapa">${icon('lock')}<span class="label">Ordens de serviço</span><span class="soon">EM BREVE</span></button></nav><div class="sidebar-bottom"><div class="navtitle">ORGANIZAÇÃO</div><nav>${nav('empresa','gear','Configuração da empresa')}</nav><div class="classnote">${icon('cap')}<b>Aprender fazendo.</b>Da sala de aula à prática da manutenção industrial.</div><div class="user"><span class="avatar">${esc(initials(state.company.group))}</span><span><b style="font-size:11px">${esc(state.company.group)}</b><small>Automação Industrial</small></span></div></div></aside><div class="main"><header class="topbar"><button class="iconbtn" data-action="menu" aria-label="Alternar menu lateral">${icon('menu')}</button><div class="crumb" title="${esc(state.company.specialty)}"><span>${esc(state.company.name)}</span> ${icon('chevron')} <b>${titles[page]}</b></div><div class="topright"><span class="pill"><span class="dot"></span> Ambiente didático</span><button class="iconbtn" data-action="info" aria-label="Informações de armazenamento">${icon('help')}</button><a class="avatar" href="#empresa" aria-label="Configuração da equipe">${esc(initials(state.company.group))}</a></div></header><main class="content">${storageError?'<div class="form-error">Não foi possível recuperar os dados locais. Os exemplos estão disponíveis; o salvamento precisa ser verificado.</div>':''}${renderPage()}<footer class="footer"><span>PCM Didático <span style="margin:0 7px">·</span> Planejamento e controle da manutenção</span><button data-action="info">Demonstração · dados neste navegador ${icon('help').replace('<svg','<svg style="width:11px;height:11px;vertical-align:middle"')}</button></footer></main></div></div>`;bindPage();}
function initials(s){return String(s).trim().split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase();}
function heading(title,sub,action='',label=''){return `<div class="page-head"><div><div class="eyebrow">${esc(state.company.group)} / VISÃO DA OPERAÇÃO</div><h1>${title}</h1><p class="subtitle">${sub}</p></div>${action?`<button class="btn" data-action="${action}">${icon('plus')}${label}</button>`:''}</div>`;}

function dashboard(){const open=state.requests.filter(r=>r.status==='Aberta').length,analysis=state.requests.filter(r=>r.status==='Em análise').length,active=state.equipment.filter(e=>e.active).length;return `${heading('Tudo pronto para a próxima etapa.','Acompanhe os ativos e organize as demandas da sua equipe.','new-ss','Nova solicitação')}<section class="hero"><div class="welcome"><div class="copy"><div class="eyebrow" style="color:#6c8bb6">SEU LABORATÓRIO DE MANUTENÇÃO</div><h2>Uma operação organizada<br>começa com você.</h2><p>Cadastre equipamentos, registre solicitações e conecte cada etapa da manutenção.</p><a href="#equipamentos" class="textlink">Explorar equipamentos ${icon('arrow')}</a></div>${machine()}</div><div class="learning"><div class="headrow"><span class="labicon">${icon('flow')}</span><span class="badge blue">ETAPA 01 / 09</span></div><h2>Do cadastro à decisão</h2><p>Entenda como uma demanda percorre o fluxo de manutenção industrial.</p><a href="#fluxo" class="textlink">Conhecer o fluxo ${icon('arrow')}</a></div></section><section class="stats">${stat('Equipamentos cadastrados',state.equipment.length,`${active} ativos`,' no laboratório','box')}${stat('Solicitações abertas',open,'Aguardando',' análise da equipe','file')}${stat('Em análise',analysis,'Demandas',' em avaliação','activity')}${stat('Prioridade alta',state.requests.filter(r=>['Alta','Urgente'].includes(r.priority)&&r.status!=='Cancelada').length,'Atenção',' às próximas decisões','clock')}</section><section class="grid-bottom"><div class="card"><div class="cardhead"><div><h2>Solicitações recentes</h2><p>As últimas demandas da sua operação</p></div><a href="#solicitacoes" class="textlink">Ver todas ${icon('arrow')}</a></div>${state.requests.length?requestTable([...state.requests].reverse().slice(0,4),true):empty('Nenhuma solicitação aberta ainda','Comece registrando uma necessidade de manutenção.','new-ss','Abrir solicitação')}<div class="tablefoot"><span>${state.requests.length} solicitações registradas</span><span>Dados demonstrativos</span></div></div><div class="card"><div class="cardhead"><div><h2>Tipos de manutenção</h2><p>Distribuição das solicitações</p></div>${icon('activity')}</div>${donut()}</div></section><section class="card journey"><div class="journeyhead"><h2>O caminho da manutenção</h2><a href="#fluxo" class="textlink">Explorar fluxo ${icon('arrow')}</a></div><div class="mini-flow">${['Cadastro','Solicitação','Análise','Ordem de serviço','Execução','Resultados'].map((x,i)=>`${i?'<div class="line"></div>':''}<div class="mini-node ${i>2?'future':''}"><span class="num">${i>2?icon('lock').replace('<svg','<svg style="width:12px;height:12px"'):String(i+1).padStart(2,'0')}</span>${x}</div>`).join('')}</div></section>`;}
function stat(label,value,accent,foot,i){return `<div class="stat"><div class="statlabel">${label}${icon(i)}</div><div class="statvalue">${String(value).padStart(2,'0')}</div><div class="statfoot"><span>${accent}</span>${foot}</div></div>`;}
function donut(){let colors=['#264f8d','#7a9dcd','#b4cae8','#dce6f4'],n=state.requests.length,acc=0,gradient=types.map((t,i)=>{let start=acc;acc+=n?state.requests.filter(r=>r.type===t).length/n*100:0;return `${colors[i]} ${start}% ${acc}%`}).join(',');return `<div class="donutwrap"><div class="donut" style="background:${n?`conic-gradient(${gradient})`:'#eef2f7'}"><div class="donuttext"><b>${String(n).padStart(2,'0')}</b><small>solicitações</small></div></div></div><div class="legend">${types.map((t,i)=>`<div><i style="background:${colors[i]}"></i>${t}<b>${state.requests.filter(r=>r.type===t).length}</b></div>`).join('')}</div>`;}
function empty(title,sub,action,label){return `<div class="empty">${icon('box')}<h2>${title}</h2><p>${sub}</p>${action?`<button class="btn" data-action="${action}">${icon('plus')}${label}</button>`:''}</div>`;}
function requestTable(rows,compact=false){return `<div class="tablewrap"><table><thead><tr><th>Solicitação / equipamento</th>${compact?'':'<th>Solicitante / abertura</th><th>Tipo</th>'}<th>Prioridade</th><th>Status</th><th><span class="sr">Ações</span></th></tr></thead><tbody>${rows.map(r=>{const e=state.equipment.find(e=>e.id===r.equipmentId);return `<tr><td><button style="text-align:left;padding:0" data-action="edit-ss" data-id="${esc(r.id)}"><strong>${esc(r.number)}</strong><small>${esc(e?.tag||'—')} · ${esc(e?.name||'Equipamento indisponível')}</small></button></td>${compact?'':`<td>${esc(r.requester)}<small>${fmt(r.date)}</small></td><td>${esc(r.type)}</td>`}<td>${priority(r.priority)}</td><td>${badge(r.status)}</td><td><div class="row-actions"><button class="iconbtn" data-action="edit-ss" data-id="${esc(r.id)}" aria-label="Consultar ${esc(r.number)}">${icon(compact?'chevron':'edit')}</button>${compact?'':`<button class="iconbtn" data-action="delete-ss" data-id="${esc(r.id)}" aria-label="Excluir ${esc(r.number)}">${icon('trash')}</button>`}</div></td></tr>`}).join('')}</tbody></table></div>`;}
function opts(values,selected,all=false){return `${all?`<option value="Todos">${all===true?'Todos':all}</option>`:''}`+values.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('');}
function filtered(){let q=query.toLocaleLowerCase('pt-BR');return (page==='equipamentos'?state.equipment:state.requests).filter(r=>{if(page==='equipamentos')return `${r.tag} ${r.name} ${r.category} ${r.location}`.toLocaleLowerCase('pt-BR').includes(q)&&(filter==='Todos'||(r.active?'Ativo':'Inativo')===filter);let e=state.equipment.find(e=>e.id===r.equipmentId);return `${r.number} ${r.requester} ${r.description} ${e?.tag} ${e?.name}`.toLocaleLowerCase('pt-BR').includes(q)&&(filter==='Todos'||r.status===filter)&&(typeFilter==='Todos'||r.type===typeFilter);}).reverse();}
function listing(){let eq=page==='equipamentos';return `${heading(eq?'Equipamentos':'Solicitações de serviço',eq?'Cada ativo identificado. Cada informação no lugar certo.':'Transforme uma necessidade em uma demanda organizada.',eq?'new-eq':'new-ss',eq?'Novo equipamento':'Nova solicitação')}<section class="card"><div class="toolbar"><label class="search">${icon('search')}<input id="query" aria-label="Buscar ${eq?'equipamentos':'solicitações'}" placeholder="${eq?'Buscar por TAG, nome ou localização...':'Buscar por número, equipamento ou solicitante...'}" value="${esc(query)}"></label><select id="filter" aria-label="Filtrar por status">${opts(eq?['Ativo','Inativo']:statuses,filter,'Todos os status')}</select>${eq?'':`<select id="typefilter" aria-label="Filtrar por tipo">${opts(types,typeFilter,'Todos os tipos')}</select>`}</div><div id="listcontent">${listContent()}</div></section><p class="hint">${eq?'A TAG identifica o equipamento de forma única. Ativos vinculados a solicitações podem ser inativados, mas não excluídos.':'Todas as especialidades podem registrar solicitações corretivas, preventivas, preditivas e de melhoria.'}</p>`;}
function listContent(){let eq=page==='equipamentos',rows=filtered(),count=rows.length;pageIndex=Math.min(pageIndex,Math.max(0,Math.ceil(count/6)-1));let shown=rows.slice(pageIndex*6,pageIndex*6+6);return `${!count?empty(query||filter!=='Todos'||typeFilter!=='Todos'?'Nenhum resultado encontrado':eq?'Nenhum equipamento cadastrado ainda':'Nenhuma solicitação cadastrada ainda',query?'Experimente outro termo ou ajuste os filtros.':eq?'Adicione o primeiro ativo da sua empresa.':'Registre a primeira demanda da equipe.',query?'':eq?'new-eq':'new-ss',eq?'Adicionar novo':'Nova solicitação'):eq?`<div class="tablewrap"><table><thead><tr><th>Equipamento</th><th>TAG</th><th>Categoria</th><th>Localização</th><th>Status</th><th>Ações</th></tr></thead><tbody>${shown.map(e=>`<tr><td><strong>${esc(e.name)}</strong><small>${esc(e.manufacturer||'Fabricante não informado')}</small></td><td><span class="tag">${esc(e.tag)}</span></td><td>${esc(e.category)}</td><td>${esc(e.location)}</td><td>${badge(e.active?'Ativo':'Inativo')}</td><td><div class="row-actions"><button class="iconbtn" data-action="edit-eq" data-id="${esc(e.id)}" aria-label="Editar ${esc(e.tag)}">${icon('edit')}</button><button class="iconbtn" data-action="delete-eq" data-id="${esc(e.id)}" aria-label="Excluir ${esc(e.tag)}">${icon('trash')}</button></div></td></tr>`).join('')}</tbody></table></div>`:requestTable(shown)}<div class="tablefoot"><span>${count?`${pageIndex*6+1}–${Math.min(pageIndex*6+6,count)} de ${count}`:'0 registros'}</span><div><button class="iconbtn" data-action="prev" aria-label="Página anterior" ${pageIndex===0?'disabled':''}>‹</button><span>Página ${pageIndex+1} de ${Math.max(1,Math.ceil(count/6))}</span><button class="iconbtn" data-action="next" aria-label="Próxima página" ${(pageIndex+1)*6>=count?'disabled':''}>›</button></div></div>`;}
function field(label,name,value='',required=false,full=false,type='text',help=''){return `<label class="field ${full?'full':''}"><span>${label}${required?' <span class="required">*</span>':''}</span><input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} maxlength="${name==='tag'?40:150}">${help?`<small>${help}</small>`:''}</label>`;}
function companyPage(){let c=state.company;return `${heading('Sua empresa, sua identidade.','Configure o grupo que vai conduzir os desafios de manutenção.')}<div class="settings-grid"><section class="card form-card"><h2>Identificação da empresa</h2><p class="subtitle" style="margin-bottom:25px">Dados editáveis do seu ambiente de aprendizagem.</p><form id="companyform" novalidate><div class="formgrid">${field('Identificação do grupo','group',c.group,true)}${field('Nome da empresa fictícia','name',c.name,true)}<label class="field full"><span>Especialidade técnica <span class="required">*</span></span><select name="specialty" required>${opts(specialties,c.specialty)}</select><small>Escolha uma especialidade. Os quatro tipos de manutenção continuam disponíveis.</small></label><label class="field full"><span>Integrantes da equipe <span class="required">*</span></span><textarea name="members" required maxlength="3000" rows="5">${esc(c.members)}</textarea><small>Insira um nome por linha.</small></label></div><div class="form-error" role="alert"></div><div class="form-actions"><button class="btn" type="submit">${icon('check')}Salvar alterações</button></div></form></section><section><div class="card profile-preview"><div class="profile-icon">${icon('building')}</div><h2>${esc(c.name)}</h2><p>${esc(c.specialty)}</p><span class="badge blue">${esc(c.group)}</span><div class="teamlist"><div class="eyebrow">INTEGRANTES DA EQUIPE</div>${c.members.split('\n').filter(x=>x.trim()).map(n=>`<div class="team-member"><span class="avatar">${esc(initials(n))}</span>${esc(n)}</div>`).join('')}</div></div><div class="notice" style="margin-top:18px">${icon('help')} <b>Ambiente demonstrativo</b><br>Os dados são fictícios e ficam salvos neste navegador. A conexão ao Supabase do projeto original ainda não foi configurada.</div></section></div>`;}

function renderPage(){return page==='painel'?dashboard():page==='empresa'?companyPage():['equipamentos','solicitacoes'].includes(page)?listing():page==='fluxo'?workflow():heading('Ordens de serviço','Esta etapa será disponibilizada em uma próxima versão.')+empty('Em breve','O ciclo de OS ainda não está disponível.','','');}
function bindPage(){document.getElementById('query')?.addEventListener('input',e=>{query=e.target.value;pageIndex=0;updateList();});document.getElementById('filter')?.addEventListener('change',e=>{filter=e.target.value;pageIndex=0;updateList();});document.getElementById('typefilter')?.addEventListener('change',e=>{typeFilter=e.target.value;pageIndex=0;updateList();});document.getElementById('companyform')?.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=Object.fromEntries(new FormData(f));try{for(let k of ['name','group','members'])if(!d[k].trim())throw Error('Preencha todos os campos obrigatórios.');if(!specialties.includes(d.specialty))throw Error('Escolha uma especialidade válida.');commit(s=>s.company=Object.fromEntries(Object.entries(d).map(([k,v])=>[k,v.trim()])));shell();toast('Configuração da empresa salva com sucesso.');}catch(err){showError(f,err);}});}
function updateList(){document.getElementById('listcontent').innerHTML=listContent();}
function showError(form,error){form.querySelector('.form-error').textContent=error.message;form.querySelectorAll('[required]').forEach(el=>el.setAttribute('aria-invalid',String(!el.value.trim())));form.querySelector('[aria-invalid="true"]')?.focus();}
const modal=document.getElementById('modal');let returnFocus;
function openModal(title,subtitle,body){returnFocus=document.activeElement;modal.innerHTML=`<div class="modalhead"><div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="iconbtn" data-action="close" aria-label="Fechar janela">${icon('close')}</button></div><div class="modalbody">${body}</div>`;modal.showModal();}
modal.addEventListener('close',()=>returnFocus?.isConnected&&returnFocus.focus());
function equipmentModal(id){let e=state.equipment.find(x=>x.id===id)||{active:true};openModal(id?'Editar equipamento':'Novo equipamento','Identifique o ativo. Campos com * são obrigatórios.',`<form id="equipmentform" novalidate><div class="formgrid">${field('TAG','tag',e.tag,true,false,'text','Identificador único. Ex.: MOT-302')}${field('Nome do equipamento','name',e.name,true)}${field('Categoria','category',e.category,true)}${field('Localização','location',e.location,true)}${field('Fabricante','manufacturer',e.manufacturer)}${field('Modelo','model',e.model)}<label class="field full"><span>Descrição</span><textarea name="description" maxlength="3000">${esc(e.description)}</textarea></label><label class="field full"><span>Status do equipamento</span><span class="switchline"><input type="checkbox" role="switch" name="active" ${e.active?'checked':''}><span>Ativo</span></span><small>Desative para indicar que o ativo não está em uso.</small></label></div><div class="form-error" role="alert"></div><div class="form-actions"><button type="button" class="btn secondary" data-action="close">Cancelar</button><button class="btn" type="submit">${icon('check')}Salvar equipamento</button></div></form>`);document.getElementById('equipmentform').onsubmit=ev=>{ev.preventDefault();let f=ev.target,d=Object.fromEntries(new FormData(f));d.active=f.elements.active.checked;d.tag=d.tag.trim().toUpperCase();for(let k of ['name','category','location','manufacturer','model','description'])d[k]=d[k].trim();try{commit(s=>{validateEquipment(d,s,id);if(id)s.equipment=s.equipment.map(x=>x.id===id?{...x,...d}:x);else s.equipment.push({...d,id:uid()});});modal.close();shell();toast('Equipamento salvo com sucesso.');}catch(err){showError(f,err);}};}
function ssModal(id){if(!state.equipment.length){toast('Cadastre um equipamento antes de abrir uma solicitação.',true);location.hash='equipamentos';return;}let r=state.requests.find(x=>x.id===id)||{status:'Aberta',priority:'Média',type:'Corretiva'};openModal(id?r.number:'Nova solicitação de serviço',id?`Abertura: ${fmt(r.date)} · número e data preservados`:'Número e data serão gerados automaticamente ao salvar.',`<form id="ssform" novalidate><div class="formgrid">${field('Solicitante','requester',r.requester,true,true)}<label class="field full"><span>Buscar equipamento</span><input id="eqsearch" type="search" placeholder="Buscar por TAG ou nome..." aria-label="Buscar equipamento no cadastro"></label><label class="field full"><span>Equipamento relacionado <span class="required">*</span></span><select name="equipmentId" id="eqselect" required><option value="">Selecione um equipamento</option>${equipmentOptions('',r.equipmentId)}</select><small>O vínculo usa a identificação do cadastro e permanece após edições.</small></label><label class="field full"><span>Descrição da necessidade <span class="required">*</span></span><textarea name="description" required maxlength="4000" placeholder="Descreva o que foi observado e onde...">${esc(r.description)}</textarea></label><label class="field"><span>Tipo de manutenção <span class="required">*</span></span><select name="type" required>${opts(types,r.type)}</select></label><label class="field"><span>Prioridade <span class="required">*</span></span><select name="priority" required>${opts(priorities,r.priority)}</select></label>${id?`<label class="field full"><span>Status</span><select name="status">${opts(statuses,r.status)}</select></label>`:'<input type="hidden" name="status" value="Aberta">'}</div><div class="form-error" role="alert"></div><div class="form-actions"><button type="button" class="btn secondary" data-action="close">Cancelar</button><button class="btn" type="submit">${icon('check')}${id?'Salvar alterações':'Abrir solicitação'}</button></div></form>`);document.getElementById('eqsearch').oninput=e=>{let sel=document.getElementById('eqselect'),selected=sel.value;sel.innerHTML='<option value="">Selecione um equipamento</option>'+equipmentOptions(e.target.value,selected);};document.getElementById('ssform').onsubmit=ev=>{ev.preventDefault();let f=ev.target,d=Object.fromEntries(new FormData(f));d.requester=d.requester.trim();d.description=d.description.trim();try{commit(s=>{validateRequest(d,s);if(id)s.requests=s.requests.map(x=>x.id===id?{...x,...d}:x);else s.requests.push({...d,id:uid(),date:new Date().toISOString(),number:nextNumber(s)});});modal.close();shell();toast(id?'Solicitação atualizada com sucesso.':'Solicitação aberta com sucesso.');}catch(err){showError(f,err);}};}
function equipmentOptions(q,selected){return state.equipment.filter(e=>e.id===selected||`${e.tag} ${e.name}`.toLowerCase().includes(q.toLowerCase())).map(e=>`<option value="${esc(e.id)}" ${e.id===selected?'selected':''}>${esc(e.tag)} — ${esc(e.name)}${e.active?'':' (Inativo)'}</option>`).join('');}
function deleteModal(kind,id){let eq=kind==='eq',item=(eq?state.equipment:state.requests).find(x=>x.id===id);if(!item)return;if(eq&&state.requests.some(r=>r.equipmentId===id)){toast('Equipamento vinculado a uma SS. Edite o cadastro para inativá-lo.',true);return;}openModal('Excluir registro?',eq?item.tag:item.number,`<p style="color:#79879c;line-height:1.8">${eq?'O equipamento será removido do cadastro.':'A solicitação será removida. O número não será reutilizado.'} Esta ação não pode ser desfeita.</p><div class="form-actions"><button class="btn secondary" data-action="close">Manter registro</button><button class="btn danger" id="confirmdelete">${icon('trash')}Excluir registro</button></div>`);document.getElementById('confirmdelete').onclick=()=>{try{commit(s=>{if(eq)removeEquipment(s,id);else s.requests=s.requests.filter(x=>x.id!==id);});modal.close();shell();toast('Registro excluído.');}catch(err){toast(err.message,true);}};}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let a=b.dataset.action,id=b.dataset.id;if(a==='menu'){if(innerWidth<=680){mobile=!mobile;collapsed=false;}else collapsed=!collapsed;shell();}else if(a==='new-eq')equipmentModal();else if(a==='edit-eq')equipmentModal(id);else if(a==='new-ss')ssModal();else if(a==='edit-ss')ssModal(id);else if(a==='delete-eq')deleteModal('eq',id);else if(a==='delete-ss')deleteModal('ss',id);else if(a==='close')modal.close();else if(a==='prev'||a==='next'){pageIndex+=a==='prev'?-1:1;updateList();}else if(a==='info')openModal('Sobre este ambiente','Versão didática de demonstração',`<div class="notice"><b>Persistência neste navegador</b><br>Empresa, equipamentos e solicitações ficam salvos após atualizar a página. Não há sincronização com outros dispositivos.<br><br><b>Supabase pendente</b><br>Esta versão não está conectada ao banco do aplicativo original. A integração depende do código, esquema de tabelas e configuração pública do projeto.<br><br><b>Exemplos fictícios</b><br>Os cadastros iniciais servem apenas para aprendizagem e não representam especificações reais de fabricantes.</div><div class="form-actions"><button class="btn" data-action="close">Entendi</button></div>`);});
window.addEventListener('hashchange',()=>{page=location.hash.slice(1);if(!titles[page])page='painel';query='';filter='Todos';typeFilter='Todos';pageIndex=0;mobile=false;shell();window.scrollTo(0,0);});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{let next=JSON.parse(e.newValue);if(next.company&&Array.isArray(next.equipment)&&Array.isArray(next.requests)){state=next;shell();toast('Dados atualizados em outra aba.');}}catch{}}});
shell();

</script></body></html>
