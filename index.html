let page=location.hash.slice(1)||'painel',query='',filter='Todos',typeFilter='Todos',pageIndex=0,collapsed=false,mobile=false;const titles={painel:'Painel inicial',empresa:'Configuração da empresa',equipamentos:'Equipamentos',solicitacoes:'Solicitações de serviço',fluxo:'Fluxo de manutenção',os:'Ordens de serviço'};if(!titles[page])page='painel';

function nav(id,i,label){return `<a href="#${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''} title="${label}">${icon(i)}<span class="label">${label}</span></a>`;}
function shell(){document.getElementById('app').innerHTML=`<div class="shell ${collapsed?'collapsed':''} ${mobile?'mobile-open':''}"><aside class="sidebar"><button class="mobile-close iconbtn" data-action="menu" aria-label="Fechar menu">${icon('close')}</button><a href="#painel" class="brand brand-logo" aria-label="BINTECH — painel inicial"><img src="assets/logo-bintech.png" alt="BINTECH — Tecnologia minimalista e inovadora" width="1024" height="559"></a><a href="#empresa" class="company"><span class="tile">${icon('building')}</span><span><b>${esc(state.company.name)}</b><small>${esc(state.company.specialty)}</small></span></a><div class="navtitle">ÁREA DE TRABALHO</div><nav>${nav('painel','grid','Painel inicial')}${nav('equipamentos','box','Equipamentos')}${nav('solicitacoes','file','Solicitações de serviço')}${nav('fluxo','flow','Fluxo de manutenção')}<button disabled title="Disponível em uma próxima etapa">${icon('lock')}<span class="label">Ordens de serviço</span><span class="soon">EM BREVE</span></button></nav><div class="sidebar-bottom"><div class="navtitle">ORGANIZAÇÃO</div><nav>${nav('empresa','gear','Configuração da empresa')}</nav><div class="classnote">${icon('cap')}<b>Precisão em<br>cada etapa.</b>Da sala de aula à prática da manutenção industrial.</div><div class="user"><span class="avatar">${esc(initials(state.company.group))}</span><span><b style="font-size:11px">${esc(state.company.group)}</b><small>Automação Industrial</small></span></div></div></aside><div class="main"><header class="topbar"><button class="iconbtn" data-action="menu" aria-label="Alternar menu lateral">${icon('menu')}</button><div class="crumb" title="${esc(state.company.specialty)}"><span>${esc(state.company.name)}</span> ${icon('chevron')} <b>${titles[page]}</b></div><div class="topright"><span class="pill"><span class="dot"></span> Ambiente didático</span><button class="iconbtn" data-action="info" aria-label="Informações de armazenamento">${icon('help')}</button><a class="avatar" function initials(s){return String(s).trim().split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase();}
function heading(title,sub,action='',label=''){return `<div class="page-head"><div><div class="eyebrow">${esc(state.company.name)} / VISÃO DA OPERAÇÃO</div><h1>${title}</h1><p class="subtitle">${sub}</p></div>${action?`<button class="btn" data-action="${action}">${icon('plus')}${label}</button>`:''}</div>`;}

function dashboard(){const open=state.requests.filter(r=>r.status==='Aberta').length,analysis=state.requests.filter(r=>r.status==='Em análise').length,active=state.equipment.filter(e=>e.active).length;return `${heading('Sua manutenção. Sob controle.','Acompanhe os ativos e organize as demandas da sua equipe.','new-ss','Nova solicitação')}<section class="hero"><div class="welcome"><div class="copy"><div class="eyebrow" style="color:#6c8bb6">SEU LABORATÓRIO DE MANUTENÇÃO</div><h2>INSPECIONE.<br>REGISTRE. RESOLVA.</h2><p>Cadastre equipamentos, registre solicitações e conecte cada etapa da manutenção.</p><a href="#equipamentos" class="textlink">Explorar equipamentos ${icon('arrow')}</a></div>${machine()}</div><div class="learning"><div class="headrow"><span class="labicon">${icon('flow')}</span><span class="badge blue">CICLO DE MANUTENÇÃO</span></div><h2>DA SS À<br>ENTREGA.</h2><p>Entenda como uma demanda percorre o fluxo de manutenção industrial.</p><a href="#fluxo" class="textlink">Conhecer o fluxo ${icon('arrow')}</a></div></section><section class="stats">${stat('Equipamentos cadastrados',state.equipment.length,`${active} ativos`,' no laboratório','box')}${stat('Solicitações abertas',open,'Aguardando',' análise da equipe','file')}${stat('Em análise',analysis,'Demandas',' em avaliação','activity')}${stat('Prioridade alta',state.requests.filter(r=>['Alta','Crítica','Urgente'].includes(r.priority)&&r.status!=='Cancelada').length,'Atenção',' às próximas decisões','clock')}</section><section class="grid-bottom"><div class="card"><div class="cardhead"><div><h2>Solicitações recentes</h2><p>As últimas demandas da sua operação</p></div><a href="#solicitacoes" class="textlink">Ver todas ${icon('arrow')}</a></div>${state.requests.length?requestTable([...state.requests].reverse().slice(0,4),true):empty('Nenhuma solicitação aberta ainda','Comece registrando uma necessidade de manutenção.','new-ss','Abrir solicitação')}<div class="tablefoot"><span>${state.requests.length} solicitações registradas</span><span>Dados demonstrativos</span></div></div><div class="card"><div class="cardhead"><div><h2>Tipos de manutenção</h2><p>Distribuição das solicitações</p></div>${icon('activity')}</div>${donut()}</div></section><section class="card journey"><div class="journeyhead"><h2>O caminho da manutenção</h2><a href="#fluxo" class="textlink">Explorar fluxo ${icon('arrow')}</a></div><div class="mini-flow">${['Cadastro','Solicitação','Análise','Ordem de serviço','Execução','Resultados'].map((x,i)=>`${i?'<div class="line"></div>':''}<div class="mini-node ${i>2?'future':''}"><span class="num">${i>2?icon('lock').replace('<svg','<svg style="width:12px;height:12px"'):String(i+1).padStart(2,'0')}</span>${x}</div>`).join('')}</div></section>`;}
function stat(label,value,accent,foot,i){return `<div class="stat"><div class="statlabel">${label}${icon(i)}</div><div class="statvalue">${String(value).padStart(2,'0')}</div><div class="statfoot"><span>${accent}</span>${foot}</div></div>`;}
function donut(){let colors=['#264f8d','#7a9dcd','#b4cae8','#dce6f4'],n=state.requests.length,acc=0,gradient=types.map((t,i)=>{let start=acc;acc+=n?state.requests.filter(r=>r.type===t).length/n*100:0;return `${colors[i]} ${start}% ${acc}%`}).join(',');return `<div class="donutwrap"><div class="donut" style="background:${n?`conic-gradient(${gradient})`:'#eef2f7'}"><div class="donuttext"><b>${String(n).padStart(2,'0')}</b><small>solicitações</small></div></div></div><div class="legend">${types.map((t,i)=>`<div><i style="background:${colors[i]}"></i>${t}<b>${state.requests.filter(r=>r.type===t).length}</b></div>`).join('')}</div>`;}

function requestTable(rows,compact=false){return `<div class="tablewrap"><table><thead><tr><th>Solicitação / equipamento</th>${compact?'':'<th>Solicitante / abertura</th><th>Tipo</th>'}<th>Prioridade</th><th>Status</th><th><span class="sr">Ações</span></th></tr></thead><tbody>${rows.map(r=>{const e=state.equipment.find(e=>e.id===r.equipmentId);return `<tr><td><button style="text-align:left;padding:0" data-action="edit-ss" data-id="${esc(r.id)}"><strong>${esc(r.number)}</strong><small>${esc(e?.tag||'—')} · ${esc(e?.name||'Equipamento indisponível')}</small></button></td>${compact?'':`<td>${esc(r.requester)}<small>${fmt(r.date)}</small></td><td>${esc(r.type)}</td>`}<td>${priority(r.priority)}</td><td>${badge(r.status)}</td><td><div class="row-actions"><button class="iconbtn" data-action="edit-ss" data-id="${esc(r.id)}" aria-label="Consultar ${esc(r.number)}">${icon(compact?'chevron':'edit')}</button>${compact?'':`<button class="iconbtn" data-action="delete-ss" data-id="${esc(r.id)}" aria-label="Excluir ${esc(r.number)}">${icon('trash')}</button>`}</div></td></tr>`}).join('')}</tbody></table></div>`;}
function opts(values,selected,all=false){return `${all?`<option value="Todos">${all===true?'Todos':all}</option>`:''}`+values.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('');}
function filtered(){let q=query.toLocaleLowerCase('pt-BR');return (page==='equipamentos'?state.equipment:state.requests).filter(r=>{if(page==='equipamentos')return `${r.tag} ${r.name} ${r.category} ${r.location}`.toLocaleLowerCase('pt-BR').includes(q)&&(filter==='Todos'||(r.active?'Ativo':'Inativo')===filter);let e=state.equipment.find(e=>e.id===r.equipmentId);return `${r.number} ${r.requester} ${r.description} ${e?.tag} ${e?.name}`.toLocaleLowerCase('pt-BR').includes(q)&&(filter==='Todos'||r.status===filter)&&(typeFilter==='Todos'||r.type===typeFilter);}).reverse();}
function listing(){let eq=page==='equipamentos';return `${heading(eq?'Equipamentos':'Solicitações de serviço',eq?'Cada ativo identificado. Cada informação no lugar certo.':'Transforme uma necessidade em uma demanda organizada.',eq?'new-eq':'new-ss',eq?'Novo equipamento':'Nova solicitação')}<section class="card"><div class="toolbar"><label class="search">${icon('search')}<input id="query" aria-label="Buscar ${eq?'equipamentos':'solicitações'}" placeholder="${eq?'Buscar por TAG, nome ou localização...':'Buscar por número, equipamento ou solicitante...'}" value="${esc(query)}"></label><select id="filter" aria-label="Filtrar por status">${opts(eq?['Ativo','Inativo']:statuses,filter,'Todos os status')}</select>${eq?'':`<select id="typefilter" aria-label="Filtrar por tipo">${opts(types,typeFilter,'Todos os tipos')}</select>`}</div><div id="listcontent">${listContent()}</div></section><p class="hint">${eq?'A TAG identifica o equipamento de forma única. Ativos vinculados a solicitações podem ser inativados, mas não excluídos.':'Todas as especialidades podem registrar solicitações corretivas, preventivas, preditivas e de melhoria.'}</p>`;}
function listContent(){let eq=page==='equipamentos',rows=filtered(),count=rows.length;pageIndex=Math.min(pageIndex,Math.max(0,Math.ceil(count/6)-1));let shown=rows.slice(pageIndex*6,pageIndex*6+6);return `${!count?empty(query||filter!=='Todos'||typeFilter!=='Todos'?'Nenhum resultado encontrado':eq?'Nenhum equipamento cadastrado ainda':'Nenhuma solicitação cadastrada ainda',query?'Experimente outro termo ou ajuste os filtros.':eq?'Adicione o primeiro ativo da sua empresa.':'Registre a primeira demanda da equipe.',query?'':eq?'new-eq':'new-ss',eq?'Adicionar novo':'Nova solicitação'):eq?`<div class="tablewrap"><table><thead><tr><th>Equipamento</th><th>TAG</th><th>Categoria</th><th>Localização</th><th>Status</th><th>Ações</th></tr></thead><tbody>${shown.map(e=>`<tr><td><strong>${esc(e.name)}</strong><small>${esc(e.manufacturer||'Fabricante não informado')}</small></td><td><span class="tag">${esc(e.tag)}</span></td><td>${esc(e.category)}</td><td>${esc(e.location)}</td><td>${badge(e.active?'Ativo':'Inativo')}</td><td><div class="row-actions"><button class="iconbtn" data-action="edit-eq" data-id="${esc(e.id)}" aria-label="Editar ${esc(e.tag)}">${icon('edit')}</button><button class="iconbtn" data-action="delete-eq" data-id="${esc(e.id)}" aria-label="Excluir ${esc(e.tag)}">${icon('trash')}</button></div></td></tr>`).join('')}</tbody></table></div>`:requestTable(shown)}<div class="tablefoot"><span>${count?`${pageIndex*6+1}–${Math.min(pageIndex*6+6,count)} de ${count}`:'0 registros'}</span><div><button class="iconbtn" data-action="prev" aria-label="Página anterior" ${pageIndex===0?'disabled':''}>‹</button><span>Página ${pageIndex+1} de ${Math.max(1,Math.ceil(count/6))}</span><button class="iconbtn" data-action="next" aria-label="Próxima página" ${(pageIndex+1)*6>=count?'disabled':''}>›</button></div></div>`;}
function field(label,name,value='',required=false,full=false,type='text',help=''){return `<label class="field ${full?'full':''}"><span>${label}${required?' <span class="required">*</span>':''}</span><input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} maxlength="${name==='tag'?40:150}">${help?`<small>${help}</small>`:''}</label>`;}

function ssModal(id){if(!state.equipment.length){toast('Cadastre um equipamento antes de abrir uma solicitação.',true);location.hash='equipamentos';return;}let r=state.requests.find(x=>x.id===id)||{status:'Aberta',priority:'Média',type:'Corretiva'};openModal(id?r.number:'Nova solicitação de serviço',id?`Abertura: ${fmt(r.date)} · número e data preservados`:'Número e data serão gerados automaticamente ao salvar.',`<form id="ssform" novalidate><div class="formgrid">${field('Solicitante','requester',r.requester,true,true)}<label class="field full"><span>Buscar equipamento</span><input id="eqsearch" type="search" placeholder="Buscar por TAG ou nome..." aria-label="Buscar equipamento no cadastro"></label><label class="field full"><span>Equipamento relacionado <span class="required">*</span></span><select name="equipmentId" id="eqselect" required><option value="">Selecione um equipamento</option>${equipmentOptions('',r.equipmentId)}</select><small>O vínculo usa a identificação do cadastro e permanece após edições.</small></label><label class="field full"><span>Descrição da necessidade <span class="required">*</span></span><textarea name="description" required maxlength="4000" placeholder="Descreva o que foi observado e onde...">${esc(r.description)}</textarea></label><label class="field"><span>Tipo de manutenção <span class="required">*</span></span><select name="type" required>${opts(types,r.type)}</select></label><label class="field"><span>Prioridade <span class="required">*</span></span><select name="priority" required>${opts(priorities,r.priority)}</select></label>${id?`<label class="field full"><span>Status</span><select name="status">${opts(statuses,r.status)}</select></label>`:'<input type="hidden" name="status" value="Aberta">'}</div><div class="form-error" role="alert"></div><div class="form-actions"><button type="button" class="btn secondary" data-action="close">Cancelar</button><button class="btn" type="submit">${icon('check')}${id?'Salvar alterações':'Abrir solicitação'}</button></div></form>`);document.getElementById('eqsearch').oninput=e=>{let sel=document.getElementById('eqselect'),selected=sel.value;sel.innerHTML='<option value="">Selecione um equipamento</option>'+equipmentOptions(e.target.value,selected);};document.getElementById('ssform').onsubmit=ev=>{ev.preventDefault();let f=ev.target,d=Object.fromEntries(new FormData(f));d.requester=d.requester.trim();d.description=d.description.trim();try{commit(s=>{validateRequest(d,s);if(id)s.requests=s.requests.map(x=>x.id===id?{...x,...d}:x);else s.requests.push({...d,id:uid(),date:new Date().toISOString(),number:nextNumber(s)});});modal.close();shell();toast(id?'Solicitação atualizada com sucesso.':'Solicitação aberta com sucesso.');}catch(err){showError(f,err);}};}

function deleteModal(kind,id){let eq=kind==='eq',item=(eq?state.equipment:state.requests).find(x=>x.id===id);if(!item)return;if(eq&&state.requests.some(r=>r.equipmentId===id)){toast('Equipamento vinculado a uma SS. Edite o cadastro para inativá-lo.',true);return;}openModal('Excluir registro?',eq?item.tag:item.number,`<p style="color:#79879c;line-height:1.8">${eq?'O equipamento será removido do cadastro.':'A solicitação será removida. O número não será reutilizado.'} Esta ação não pode ser desfeita.</p><div class="form-actions"><button class="btn secondary" data-action="close">Manter registro</button><button class="btn danger" id="confirmdelete">${icon('trash')}Excluir registro</button></div>`);document.getElementById('confirmdelete').onclick=()=>{try{commit(s=>{if(eq)removeEquipment(s,id);else s.requests=s.requests.filter(x=>x.id!==id);});modal.close();shell();toast('Registro excluído.');}catch(err){toast(err.message,true);}};}

const baseCommit=commit;commit=function(fn){if(storageError)throw Error('Armazenamento indisponível ou dados inválidos. Preserve o arquivo local antes de continuar.');baseCommit(s=>{s.orders??=[];s.components??=[];s.audit??=[];fn(s);for(const o of s.orders){const r=s.requests.find(r=>r.id===o.requestId);if(!r||r.equipmentId!==o.equipmentId)throw Error("Vínculo protegido: a SS de uma OS não pode ser excluída nem trocar de equipamento.");}});};

function makeOrder(s,requestId){let r=s.requests.find(r=>r.id===requestId);if(!r)throw Error('Selecione uma SS válida.');if(r.status==='Cancelada')throw Error('SS cancelada não pode gerar OS.');let old=s.orders.find(o=>o.requestId===requestId);if(old)return old.id;let y=new Date().getFullYear();s.osCounter=Math.max(s.osCounter||0,...s.orders.map(o=>Number(o.number.split('-').pop())||0))+1;let o={id:uid(),number:`OS-${y}-${String(s.osCounter).padStart(3,'0')}`,requestId,equipmentId:r.equipmentId,date:now(),status:'Planejamento',owner:'',checklist:{},measurements:[],ptRequired:'Não',ptStatus:'Não analisada',dataKind:'Simulação didática'};s.orders.push(o);r.status='Em análise';log(s,'Emissão '+o.number);return o.id;}

function orderModal(id){let o=state.orders.find(x=>x.id===id);if(!o)return;let r=state.requests.find(x=>x.id===o.requestId),e=state.equipment.find(x=>x.id===o.equipmentId),closed=o.status==='Encerrada';openModal(o.number,`${e?.tag} · ${r?.number} · ${o.status}`,`<form id="orderform"><div class="notice">${esc(r?.description)}<br><b>${esc(r?.type)} · ${esc(r?.priority)}</b><br>Modelo didático: o preenchimento não substitui autorização de trabalho real.</div><fieldset ${closed?'disabled':''} style="border:0;padding:0"><div class="formgrid" style="margin-top:18px">${selectField('Etapa da OS','status',(closed?['Encerrada']:['Planejamento','Programada','Em execução','Em validação']),o.status)}${selectField('Natureza dos registros','dataKind',['Simulação didática','Registro real informado pela equipe'],o.dataKind)}</div>${sections.map(([title,fields],i)=>`<details class="os-section" ${i===0?'open':''}><summary>${i+1}. ${title}</summary><div class="formgrid">${i===1?`<div class="field full">${act('procedure','Inserir roteiro orientativo')}</div>`:''}${i===2?selectField('PT aplicável?','ptRequired',['Não','Sim'],o.ptRequired)+selectField('Análise da PT','ptStatus',['Não analisada','Em análise','Aprovada','Rejeitada'],o.ptStatus):''}${fields.map(([key,label,type])=>type==='area'?area(label,key,o[key]):field(label,key,o[key],false,false,type||'text')).join('')}</div>${i===3?`<h3 style="margin:22px 0 12px">Registro por ponto de ultrassom</h3><div class="notice">Não há limites universais pré-carregados. Registre unidade e configuração do instrumento; não converta leituras em vazão ou custo sem método validado.</div><div id="measurements">${measurementRows(o.measurements||[])}</div>${act('add-point','+ Adicionar ponto')}`:''}</details>`).join('')}<details class="os-section" open><summary>6. Checklist de conclusão</summary><div class="formgrid">${checks.map((c,i)=>selectField(c,'check'+i,['Pendente','Conforme','Não conforme','Não aplicável'],o.checklist?.[i]||'Pendente')).join('')}${area('Justificativas para não aplicável e tratamento de não conformidades','checkNotes',o.checkNotes)}</div></details></fieldset><div class="form-error" role="alert"></div><div class="form-actions sticky-actions">${act('pdf','Baixar PDF salvo',id)}${closed?`<span class="badge green">Encerrada em ${fmt(o.closedAt)}</span>`:`<button class="btn secondary" name="intent" value="save">Salvar rascunho</button><button class="btn" name="intent" value="close">Validar e encerrar</button>`}</div></form>`);modal.style.width='920px';document.getElementById('orderform').onsubmit=ev=>{ev.preventDefault();let f=ev.target,d=Object.fromEntries(new FormData(f));let close=ev.submitter?.value==='close';try{let measurements=[...f.querySelectorAll('.point-row')].map(row=>Object.fromEntries([...row.querySelectorAll('[data-key]')].map(el=>[el.dataset.key,el.value.trim()])));let checklist=Object.fromEntries(checks.map((_,i)=>[i,d['check'+i]]));commit(s=>{let item=s.orders.find(x=>x.id===id);if(item.status==='Encerrada')throw Error('OS encerrada é somente leitura.');Object.assign(item,d,{measurements,checklist});if(close){let missing=closingProblems(item);if(missing.length)throw Error('Para encerrar: '+missing.join('; '));item.status='Encerrada';item.closedAt=now();}log(s,(close?'Encerramento ':'Atualização ')+item.number);});modal.close();shell();toast(close?'OS validada e encerrada.':'Rascunho salvo.');}catch(err){showError(f,err);f.querySelector('.form-error').scrollIntoView({block:'center'});}};}
function measurementRows(rows){return rows.map(m=>`<div class="point-row"><div class="formgrid">${[['point','Ponto / localização'],['method','Método / sonda'],['value','Leitura observada'],['unit','Unidade'],['settings','Ajustes (frequência, ganho, distância)'],['reference','Referência / fonte de comparação'],['observation','Observação e conclusão']].map(([k,label])=>`<label class="field"><span>${label}</span><input data-key="${k}" value="${esc(m[k])}" maxlength="500"></label>`).join('')}</div>${act('remove-point','Remover ponto')}</div>`).join('');}
function closingProblems(o){let problems=[];['owner','scheduled','service','resources','materials','procedure','safety','criteria','risks','prevention','isolation','ptReason','instrument','verification','conditions','performed','used','anomalies','tests','results','recommendation','finalCondition','validator','validationDate','validation'].forEach(k=>{if(!o[k]?.trim())problems.push(sections.flatMap(s=>s[1]).find(f=>f[0]===k)?.[1]||k);});if(o.pending?.trim())problems.push('resolver pendências impeditivas');if(checks.some((_,i)=>!['Conforme','Não aplicável'].includes(o.checklist?.[i])))problems.push('concluir checklist sem não conformidades');if(Object.values(o.checklist||{}).includes('Não aplicável')&&!o.checkNotes?.trim())problems.push('justificar itens não aplicáveis');if(o.ptRequired==='Sim'&&(o.ptStatus!=='Aprovada'||!o.ptReviewer?.trim()||!o.ptDate))problems.push('PT analisada e aprovada por responsável identificado');if(!o.measurements?.length||o.measurements.some(m=>['point','method','value','unit','settings','reference','observation'].some(k=>!m[k]?.trim())))problems.push('registrar todos os campos de pelo menos um ponto de ultrassom');return problems;}
function bulkModal(){openModal('Gestão rápida dos equipamentos','Selecione ativos. Registros vinculados só podem ser inativados.',`<label class="field">Buscar<input id="bulkq" placeholder="TAG ou nome"></label><p class="hint"><label><input type="checkbox" id="selectall" style="width:auto"> Selecionar todos os resultados visíveis</label></p><div style="max-height:42vh;overflow:auto">${state.equipment.map(e=>`<label class="bulk-row" data-search="${esc((e.tag+' '+e.name).toLowerCase())}"><input type="checkbox" value="${esc(e.id)}" style="width:auto"><span><b>${esc(e.tag)}</b> · ${esc(e.name)}<small>${linked(state,e.id)?'Vinculado — exclusão bloqueada': 'Sem vínculos'} · ${e.active?'Ativo':'Inativo'}</small></span></label>`).join('')}</div><div class="form-actions">${act('bulk-inactive','Inativar selecionados')}${act('bulk-delete','Excluir sem vínculos')}</div>`);document.getElementById('bulkq').oninput=e=>filterCards(e.target.value);document.getElementById('selectall').onchange=e=>modal.querySelectorAll('.bulk-row:not([hidden]) input').forEach(c=>c.checked=e.target.checked);}
function bulkApply(del){let ids=[...modal.querySelectorAll('.bulk-row input:checked')].map(e=>e.value);if(!ids.length)throw Error('Selecione ao menos um equipamento.');let removable=ids.filter(id=>!linked(state,id)),blocked=ids.length-removable.length;if(del&&!removable.length)throw Error('Todos os selecionados têm vínculos. Use inativar.');if(!confirm(del?`Excluir ${removable.length} equipamento(s) sem vínculos? ${blocked} vinculado(s) serão preservados. Faça backup antes de excluir.`:`Inativar ${ids.length} equipamento(s)?`))return;commit(s=>{if(del)removable.forEach(id=>removeEquipment(s,id));else s.equipment.forEach(e=>{if(ids.includes(e.id))e.active=false;});log(s,(del?'Exclusão':'Inativação')+' em lote: '+(del?removable:ids).length);});modal.close();shell();toast('Cadastro atualizado.');}
function componentsPage(){return heading('Componentes dos equipamentos','Registre a relação entre componentes e seus ativos.')+`<div class="quickbar">${act('component','+ Cadastrar componente','',false)}</div><section class="card">${simpleTable(['TAG / nome','Equipamento','Descrição','Ações'],state.components.map(c=>[esc(c.tag)+' · '+esc(c.name),esc(state.equipment.find(e=>e.id===c.equipmentId)?.tag),esc(c.description),act('component','Editar',c.id)+act('delete-component','Excluir',c.id)]))}</section>`;}
function componentModal(id){let c=state.components.find(x=>x.id===id)||{};openModal('Componente','Relacionamento com o equipamento principal.',`<form id="componentform"><div class="formgrid">${field('TAG','tag',c.tag,true)}${field('Nome','name',c.name,true)}<label class="field full">Equipamento<select name="equipmentId" required><option value="">Selecione</option>${equipmentOptions('',c.equipmentId)}</select></label>${area('Descrição / especificações verificadas','description',c.description)}</div><div class="form-error"></div><div class="form-actions"><button class="btn">Salvar componente</button></div></form>`);document.getElementById('componentform').onsubmit=ev=>{ev.preventDefault();try{let d=Object.fromEntries(new FormData(ev.target));d.tag=d.tag.trim().toUpperCase();if(!d.tag||!d.name.trim())throw Error('Preencha TAG e nome.');commit(s=>{if(s.components.some(x=>x.id!==id&&x.tag.toUpperCase()===d.tag)||s.equipment.some(x=>x.tag.toUpperCase()===d.tag))throw Error('TAG já utilizada.');if(!s.equipment.some(e=>e.id===d.equipmentId))throw Error('Equipamento inválido.');if(id)Object.assign(s.components.find(x=>x.id===id),d);else s.components.push({...d,id:uid()});});modal.close();shell();toast('Componente salvo.');}catch(e){showError(ev.target,e);}};}
function simpleTable(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}">Nenhum registro.</td></tr>`}</tbody></table></div>`;}
function reportsPage(){return heading('Histórico e relatórios','Rastreabilidade por TAG e acompanhamento das entregas.')+`<div class="stats">${stat('Equipamentos',state.equipment.length,'',' cadastrados','box')}${stat('Componentes',state.components.length,'',' vinculados','gear')}${stat('OS abertas',state.orders.filter(o=>o.status!=='Encerrada').length,'',' em acompanhamento','wrench')}${stat('OS encerradas',state.orders.filter(o=>o.status==='Encerrada').length,'',' validadas','check')}</div><div class="quickbar"><select id="historytag" aria-label="Filtrar histórico" style="max-width:420px"><option value="">Todos os equipamentos</option>${equipmentOptions('','')}</select>${act('csv','Exportar relatório CSV')}</div><section class="card" id="historycontent">${historyHTML('')}</section><section class="card form-card" style="margin-top:20px"><h2>Últimas alterações nesta versão</h2>${state.audit.slice(-15).reverse().map(a=>`<p class="subtitle">${esc(new Date(a.date).toLocaleString('pt-BR'))} · ${esc(a.action)}</p>`).join('')||'<p class="subtitle">Sem alterações registradas.</p>'}</section>`;}
function historyHTML(id){return simpleTable(['Registro','Equipamento','Tipo / situação','Descrição / pendência'],[...state.requests.filter(r=>!id||r.equipmentId===id).map(r=>[esc(r.number),esc(state.equipment.find(e=>e.id===r.equipmentId)?.tag),esc(r.type)+' · '+badge(r.status),esc(r.description)]),...state.orders.filter(o=>!id||o.equipmentId===id).map(o=>[act('edit-order',esc(o.number),o.id),esc(state.equipment.find(e=>e.id===o.equipmentId)?.tag),badge(o.status),esc(o.pending||o.results||'Preenchimento pendente')])]);}
function renderHistory(id){document.getElementById('historycontent').innerHTML=historyHTML(id);}
function flowPage(){return heading('Da necessidade à evidência','Cada etapa corresponde a registros disponíveis no aplicativo.')+`<div class="workflow">${[['Equipamento','Identificação única, dados verificados e componentes.','equipamentos'],['Solicitação','Relato, tipo de manutenção e prioridade.','solicitacoes'],['Planejamento','Emita a OS e defina serviço, recursos e programação.','os'],['Preparação','Procedimento, riscos, PT e checklist.','os'],['Inspeção e resultados','Instrumento, pontos, leituras e conclusão de ultrassom.','os'],['Validação','Verifique pendências antes de encerrar.','os'],['Histórico','Consulte registros e exporte os documentos.','relatorios']].map((s,i)=>`<section class="worknode"><div class="eyebrow">ETAPA 0${i+1}</div><h2>${s[0]}</h2><p>${s[1]}</p><a href="#${s[2]}">Acessar →</a></section>`).join('')}</div>`;}
function dataPage(){return heading('Seus dados, sob controle','Backup portátil para guardar o trabalho e levar para outro computador.')+`<div class="settings-grid"><section class="card form-card"><h2>Backup completo</h2><p class="subtitle">Inclui empresa, equipamentos, componentes, SS, OS, medições e histórico. A importação mescla registros novos, preserva os existentes e recusa conflitos.</p><div class="quickbar">${act('backup','Exportar JSON','',false)}${act('import','Mesclar JSON')}${act('restore','Restaurar backup completo')}</div><h2 style="margin-top:25px">Armazenamento local</h2><p class="subtitle">Os dados ficam neste navegador e neste endereço. Mover o HTML, trocar de navegador, usar modo privado ou limpar os dados pode impedir a recuperação. Faça backup ao final de cada atividade.</p></section><section class="card form-card"><h2>Status desta entrega</h2><p class="subtitle">✓ Cadastro, SS, OS e relatórios locais<br>✓ PDF baixado diretamente, sem internet<br>✓ Identidade visual BINTECH<br>○ Google, Lovable Cloud e Supabase não conectados</p><div class="notice" style="margin-top:20px">O HTML não acessa os dados de outro site. Para recuperar cadastros do aplicativo hospedado, é necessário exportá-los de lá. Não há sincronização entre usuários ou dispositivos.</div></section></div>`;}
function download(name,data,mime){let a=document.createElement('a'),url=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:mime}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportBackup(){download('Bincorp_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'bincorp-pcm',version:3,exportedAt:now(),state},null,2),'application/json');}
function mergeBackup(s,incoming){let t=incoming.state||incoming;if(!t.company||!Array.isArray(t.equipment)||!Array.isArray(t.requests))throw Error('Formato de backup incompatível.');let lists=['equipment','requests','orders','components'];for(let key of lists){let source=t[key]||[];if(!Array.isArray(source))throw Error('Lista inválida: '+key);for(let item of source){if(!item||typeof item.id!=='string'||!item.id)throw Error('Registro sem ID.');let old=(s[key]||[]).find(x=>x.id===item.id);if(old&&JSON.stringify(old)!==JSON.stringify(item))throw Error('Conflito no registro '+(item.number||item.tag||item.id)+'. Nenhum dado foi importado.');if(!old){if((key==='equipment'||key==='components')&&[...s.equipment,...s.components].some(x=>x.tag.toUpperCase()===String(item.tag).toUpperCase()))throw Error('TAG conflitante: '+item.tag);if(['requests','orders'].includes(key)&&s[key].some(x=>x.number===item.number))throw Error('Número conflitante: '+item.number);s[key].push(item);}}}for(let e of s.equipment)validateEquipment(e,s,e.id);for(let r of s.requests)validateRequest(r,s);for(let c of s.components)if(!s.equipment.some(e=>e.id===c.equipmentId)||!c.tag||!c.name)throw Error('Componente inválido.');for(let o of s.orders){let r=s.requests.find(r=>r.id===o.requestId);if(!r||r.equipmentId!==o.equipmentId||!Array.isArray(o.measurements)||!o.checklist)throw Error('OS inválida ou vínculo inconsistente.');}s.osCounter=Math.max(s.osCounter||0,t.osCounter||0);log(s,'Importação de registros sem sobrescrever existentes');}
function importBackup(restore=false){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{if(input.files[0].size>10000000)throw Error('Backup excede 10 MB.');let data=JSON.parse(await input.files[0].text());if(restore){let source=data.state||data;let candidate={company:source.company,equipment:[],requests:[],orders:[],components:[],audit:[]};mergeBackup(candidate,data);if(!confirm('Restaurar todo o backup, incluindo a empresa? O backup atual será baixado antes da substituição. Guarde esse arquivo.'))return;exportBackup();baseCommit(s=>{Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,structuredClone(source),{extendedVersion:3,orders:source.orders||[],components:source.components||[],audit:source.audit||[]});});storageError=false;shell();toast('Backup restaurado.');return;}if(!confirm('Importar registros novos? Registros e empresa atuais serão preservados; conflitos cancelarão a importação.'))return;commit(s=>mergeBackup(s,data));shell();toast('Backup mesclado sem substituir registros.');}catch(e){toast(e.message,true);}};input.click();}
function reportLines(o){let r=state.requests.find(r=>r.id===o.requestId),e=state.equipment.find(e=>e.id===o.equipmentId);let lines=[state.company.name+' | '+o.number,'INSPECAO POR ULTRASSOM - PROCEDIMENTO E RESULTADOS','Grupo: '+state.company.group,'Especialidade: '+state.company.specialty,'Equipe: '+state.company.members,'Natureza: '+o.dataKind,'Status: '+o.status+' | Abertura: '+fmt(o.date),'Equipamento: '+e?.tag+' - '+e?.name,'Categoria: '+e?.category+' | Local: '+e?.location,'Fabricante: '+(e?.manufacturer||'Nao informado')+' | Modelo: '+(e?.model||'Nao informado'),'Descricao: '+e?.description,'SS: '+r?.number+' | '+r?.type+' | Prioridade: '+r?.priority,'Solicitante: '+r?.requester+' | Data: '+fmt(r?.date),'Necessidade: '+r?.description];for(let [title,fields] of sections){lines.push('',title.toUpperCase());for(let [k,l] of fields)lines.push(l+': '+(o[k]||'Nao preenchido'));if(title.startsWith('Segurança'))lines.push('PT aplicavel: '+o.ptRequired+' | Situacao: '+o.ptStatus);}lines.push('','CHECKLIST');checks.forEach((c,i)=>lines.push(c+': '+(o.checklist?.[i]||'Pendente')));lines.push('Justificativas: '+(o.checkNotes||'Nao informado'),'','PONTOS DE ULTRASSOM');o.measurements.forEach((m,i)=>lines.push('Ponto '+(i+1)+': '+m.point,'Metodo: '+m.method+' | Leitura: '+m.value+' '+m.unit,'Ajustes: '+m.settings,'Referencia: '+m.reference,'Observacao: '+m.observation));lines.push('','Encerramento: '+(o.closedAt?new Date(o.closedAt).toLocaleString('pt-BR'):'OS ainda nao encerrada'),'Documento didatico. Nao equivale a autorizacao operacional de trabalho.');return lines;}
// PDF 1.4 independente, fontes padrao e paginacao; sem CDN.
function pdfBytes(lines){const clean=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e\n]/g,'-');let wrapped=[];for(let line of lines)for(let part of clean(line).split('\n')){if(!part){wrapped.push('');continue;}while(part.length>92){let n=part.lastIndexOf(' ',92);if(n<1)n=92;wrapped.push(part.slice(0,n));part=part.slice(n).trimStart();}wrapped.push(part);}let pages=[];for(let i=0;i<wrapped.length;i+=48)pages.push(wrapped.slice(i,i+48));let objs=['<< /Type /Catalog /Pages 2 0 R >>','', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'];const literal=t=>t.replace(/([\\()])/g,'\\$1');let kids=[];pages.forEach((p,i)=>{let pageId=objs.length+1,streamId=pageId+1;kids.push(pageId+' 0 R');objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${streamId} 0 R >>`);let stream='BT /F1 10 Tf 42 795 Td 15 TL\n'+p.map(t=>'('+literal(t)+') Tj T*').join('\n')+'\nET\nBT /F1 9 Tf 42 30 Td (BINTECH PCM | Pagina '+(i+1)+' de '+pages.length+') Tj ET';objs.push(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);});objs[1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${pages.length} >>`;let out='%PDF-1.4\n',offsets=[0];objs.forEach((o,i)=>{offsets.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n';});let start=out.length;out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${start}\n%%EOF`;return new TextEncoder().encode(out);}
function exportPDF(id){let o=state.orders.find(o=>o.id===id);if(!o)throw Error('OS não encontrada.');download(o.number+'.pdf',new Blob([pdfBytes(reportLines(o))],{type:'application/pdf'}));toast('PDF gerado com os últimos dados salvos.');}
function exportCSV(){let safe=v=>{v=String(v??'');if(/^[=+@-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};let rows=[['Registro','Tipo','TAG','Status','Responsável','Descrição'],...state.requests.map(r=>[r.number,'SS',state.equipment.find(e=>e.id===r.equipmentId)?.tag,r.status,r.requester,r.description]),...state.orders.map(o=>[o.number,'OS',state.equipment.find(e=>e.id===o.equipmentId)?.tag,o.status,o.owner,o.results||o.pending||''])];download('Bincorp_relatorio.csv','\ufeff'+rows.map(r=>r.map(safe).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
document.addEventListener('click',ev=>{let b=ev.target.closest('[data-ext]');if(!b)return;let a=b.dataset.ext,id=b.dataset.id;try{if(a==='new-order'||a==='from-ss')newOrder(id);else if(a==='edit-order')orderModal(id);else if(a==='ss-new')ssModal();else if(a==='pdf')exportPDF(id);else if(a==='procedure'){let f=document.getElementById('orderform');if(f.elements.procedure.value&&!confirm('Substituir o roteiro atual pelo modelo orientativo?'))return;f.elements.procedure.value=procedure;}else if(a==='add-point')document.getElementById('measurements').insertAdjacentHTML('beforeend',measurementRows([{}]));else if(a==='remove-point'){if(confirm('Remover este ponto do rascunho?'))b.closest('.point-row').remove();}else if(a==='bulk')bulkModal();else if(a==='bulk-delete')bulkApply(true);else if(a==='bulk-inactive')bulkApply(false);else if(a==='backup')exportBackup();else if(a==='import')importBackup();else if(a==='restore')importBackup(true);else if(a==='csv')exportCSV();else if(a==='component')componentModal(id);else if(a==='delete-component'){if(confirm('Excluir o componente?')){commit(s=>s.components=s.components.filter(c=>c.id!==id));shell();}}else if(a==='examples'){let n;commit(s=>n=addExamples(s));shell();toast(n+' exemplos adicionados.');}}catch(e){toast(e.message,true);}});
// Respeita todas as TAGs, inclusive componentes, ao editar um equipamento.
const baseValidateEquipment=validateEquipment;validateEquipment=function(d,s,id){baseValidateEquipment(d,s,id);if(s.components?.some(c=>c.tag.toLowerCase()===d.tag.trim().toLowerCase()))throw Error('Esta TAG já pertence a um componente.');};
shell();
